name: Synchronisation Calendrier DFGSM2

on:
  schedule:
    # Tous les dimanches à 20h00 UTC
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-sync:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer pnpm v9
        run: npm install -g pnpm@9

      - name: Installer les dépendances
        run: pnpm install --no-frozen-lockfile

      - name: Installer Chromium et dépendances système
        run: pnpm exec playwright install --with-deps chromium

      - name: Exécuter le scraper
        run: pnpm run build:sync
        env:
          TZ: Europe/Paris
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
